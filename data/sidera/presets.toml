# Bundled preset source data; public overrides are native term Pages.

[blog]
title_key = 'collection_blog'
[blog.defaults.params]
navigation_mode = "list"
primary_date = "published"
show_updated = true
top = ["collection-nav"]
taxonomy_hubs = "index"
list_mode = 'recursive'
list_order = 'publication'
taxonomy_hierarchy = []
left = ['menu', 'recent-updates']
icon = 'blog'
recent_sections = false
[blog.defaults.cascade.params]
primary_date = "published"
left = ['menu', 'recent-updates']
right = ['toc']
show_updated = true
recent_sections = false

[notes]
title_key = 'collection_notebook'
[notes.defaults.params]
top = ["collection-nav"]
navigation_mode = "list"
primary_date = "updated"
show_updated = true
list_mode = 'recursive'
list_order = 'modification'
taxonomy_hierarchy = ['tags']
left = ['menu', {component = 'taxonomies', config = {taxonomies = ['tags']}}, 'recent-published']
icon = 'notebook'
recent_sections = false
[notes.defaults.cascade.params]
primary_date = "updated"
left = ['menu', {component = 'taxonomies', config = {taxonomies = ['tags']}}, 'recent-published']
right = ['toc']
show_updated = true
recent_sections = false

[docs]
title_key = 'collection_docs'
[docs.defaults.params]
navigation_mode = "siblings"
primary_date = "updated"
show_updated = true
list_mode = 'children'
list_order = 'title'
taxonomy_hierarchy = []
left = ['menu', 'page-tree', 'recent-updates', 'recent-published']
icon = 'docs'
recent_sections = true
[docs.defaults.cascade.params]
primary_date = "updated"
left = ['menu', 'page-tree', 'recent-updates', 'recent-published']
right = ['toc']
show_updated = true
recent_sections = true
list_mode = 'children'
