{{- $current := .current -}}
<ul>
  {{- range partial "docs/children.html" .node -}}
    <li><a data-doc-path="{{ .Path }}" href="{{ .RelPermalink }}"{{ if eq . $current }} aria-current="page"{{ else if .IsAncestor $current }} aria-current="location"{{ end }}>{{ .Title }}</a>
    {{- if .IsSection -}}{{- partial "docs/tree.html" (dict "node" . "current" $current) -}}{{- end -}}</li>
  {{- end -}}
</ul>
