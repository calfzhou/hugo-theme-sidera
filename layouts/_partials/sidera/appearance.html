<div class="appearance" hidden>
  {{ if .Settings.icons }}{{ partial "sidera/icon.html" "appearance" }}{{ end }}
  <label for="appearance">{{ T "appearance" }}</label>
  <select id="appearance" name="appearance">
    <option value="dark">{{ T "appearance_dark" }}</option>
    <option value="light">{{ T "appearance_light" }}</option>
    <option value="system">{{ T "appearance_system" }}</option>
  </select>
</div>
