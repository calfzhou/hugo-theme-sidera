{{- $dates := partial "sidera/dates.html" . -}}
{{- with $dates -}}
  <div class="article-dates"{{ if gt (len .) 1 }} tabindex="0"{{ end }}>
    {{- range $index, $date := . -}}
      <span class="{{ if $index }}date-secondary{{ else }}date-primary{{ end }}">{{ if $index }}<span class="date-separator" aria-hidden="true">|</span>{{ end }}{{ partial "date.html" $date }}</span>
    {{- end -}}
  </div>
{{- end -}}
