# Theme-owned native taxonomy definitions. Consumers opt in to this configuration
# category with [taxonomies] _merge = 'shallow'; no duplicate definitions needed.
[taxonomies]
tag = 'tags'
category = 'categories'
author = 'authors'
series = 'series'
preset = 'preset'

# Preserve safe native term slugs (including adapter-supplied Unicode slugs).
# Consumers opt in with [permalinks.term] _merge = 'shallow'.
[permalinks.term]
tags = '/tags/:slug/'
categories = '/categories/:slug/'
authors = '/authors/:slug/'
series = '/series/:slug/'
preset = '/preset/:slug/'

# Reusable configured widgets. Native site/language params can override these definitions.
[params.widgets.recent-updates]
component = 'recent'
[params.widgets.recent-updates.config]
order = 'modification'
[params.widgets.recent-published]
component = 'recent'
[params.widgets.recent-published.config]
order = 'publication'

# Stellar's default heading range, consumed through a narrow site-side import.
# Source: https://github.com/xaoxuu/hexo-theme-stellar/tree/1.44.0 (xaoxuu: https://xaoxuu.com/)
[markup.tableOfContents]
startLevel = 1
endLevel = 6

# Opt in through this leaf only; never import renderer.unsafe or all markup.
[markup.goldmark.extensions.passthrough]
enable = true
[markup.goldmark.extensions.passthrough.delimiters]
block = [['$$', '$$']]
inline = [['$', '$']]

[markup.goldmark.parser]
wrapStandAloneImageWithinParagraph = false
[markup.goldmark.parser.attribute]
block = true
